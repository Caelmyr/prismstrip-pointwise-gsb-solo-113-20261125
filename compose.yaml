name: solo116-prismstrip
services:
  desk:
    build:
      context: .
      args:
        PRISMSTRIP_DEPS_IMAGE: ${PRISMSTRIP_DEPS_IMAGE:-python:3.11-slim}
    image: ${PRISMSTRIP_IMAGE:-solo116-prismstrip:1.0}
    network_mode: bridge
    ports:
      - "127.0.0.1:${PRISMSTRIP_PORT:-19916}:8000"
    volumes:
      - measurements:/var/lib/prismstrip
    init: true
volumes:
  measurements:
